[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hddt"
version = "0.1.0"
description = "Tool kéo hóa đơn điện tử từ hệ thống của Cơ quan Thuế (hoadondientu.gdt.gov.vn)"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "openpyxl>=3.1", "reportlab>=4.0"]

[project.scripts]
hddt = "hddt.cli:main"

[tool.setuptools]
packages = ["hddt"]

[tool.setuptools.package-data]
hddt = ["templates/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
